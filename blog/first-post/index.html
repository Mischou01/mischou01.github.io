<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first blog post | mischou01</title>
    <meta name="description" content="Welcome to my first blog post.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('theme')
                ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch {}
    </script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <article class="post">
        <div class="post-top">
            <a href="/#posts" class="name">mischou01</a>
            <button type="button" class="theme-toggle">Dark mode</button>
        </div>

        <h1>My first blog post</h1>
        <time datetime="2026-04-28">April 28, 2026</time>

        <div class="post-body">
            <p>Welcome to my first blog post! This might be the last one, or the first of many, or somewhere in between there, who knows.</p>
        </div>
    </article>

    <script src="/script.js"></script>
</body>
</html>
